name: sequential workflow
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: build job
      run: echo "this is a build job"
  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
    - name: test job
      run: echo "this is a test job"
  deploy:
    runs-on: ubuntu-latest
    needs: test
    steps:
    - name: deploy the code
      run: echo "this is a deploy job"
      
